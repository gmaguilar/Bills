        \ a 404 Not Found error will be returned. The response will be in JSON format,\
        \ and the budget details will be structured according to the budget schema\
        \ defined in the components section of the API documentation. The user can\
        \ use this endpoint to view their available budget and track their spending\
        \ against their allocated budget. The result will be the difference between\
