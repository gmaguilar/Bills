  /bill/export:
    get:
      description: "Export the list of bills based on various criteria such as user\
        \ ID, category ID, status, payment method, date range, quantity range, text\
        \ search, and active status. The exported data will be in a format suitable\
        \ for further analysis or record-keeping. The user must be authenticated to\
        \ access this endpoint, and the provided bearer token must be valid. If the\
        \ token is missing or invalid, a 401 Unauthorized error will be returned.\
        \ The response will include the exported bill data in a structured format,\
        \ which can be downloaded or processed as needed. The user can combine multiple\
        \ filters to narrow down the results. If no bills match the provided filters,\
        \ an empty export will be returned. The date filters (initialDate and finalDate)\
        \ should be provided in the format DD-MM-YYYY HH:MM:SS. If only one date is\
        \ provided, the filter will apply from that date to the current date or from\
        \ the earliest bill date to that date, respectively. The user can also filter\
        \ bills by category ID, which will return the corresponding code for the category\
        \ in the response. If no category ID is provided, this filter will be ignored.\
        \ The category ID and user ID filters should correspond to existing categories\
        \ and users in the system. If invalid IDs are provided, a 400 Bad Request\
        \ error will be returned. The status and payment method filters should be\
        \ one of the allowed values defined in the StatusBill and paymentMethod schemas,\
        \ respectively. If invalid values are provided, a 400 Bad Request error will\
        \ be returned. The response will be paginated if the number of bills exceeds\
        \ a certain threshold, and the user can navigate through the pages using query\
        \ parameters for page number and page size. The list of bills must be for\
        \ the authenticated user. If the user ID provided in the query does not match\
        \ the authenticated user's ID, a 403 Forbidden error will be returned."
      operationId: exportBillList
      parameters:
      - explode: true
        in: query
        name: userId
        required: true
        schema:
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        style: form
      - explode: true
        in: query
        name: initialDate
        required: false
        schema:
          example: 2026-10-24T00:00:00Z
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: finalDate
        required: false
        schema:
          example: 2026-10-24T00:00:00Z
          format: date-time
          type: string
        style: form
      - example: PENDIENTE
        explode: true
        in: query
        name: status
        required: false
        schema:
          $ref: "#/components/schemas/StatusBill"
        style: form
      - example: EFECTIVO
        explode: true
        in: query
        name: paymentMethod
        required: false
        schema:
          $ref: "#/components/schemas/paymentMethod"
        style: form
      - description: ID of the category to filter bills by. The user will receive
          the code corresponding to the category in the response.
        example: 123e4567-e89b-12d3-a456-426614174000
        explode: true
        in: query
        name: categoryId
        required: false
        schema:
          format: uuid
          type: string
        style: form
      responses:
        "200":
          content:
            text/csv:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                properties:
                  id:
                    description: The unique identifier for the bill.
                    type: string
                  quantity:
                    description: The quantity of the bill.
                    format: float
                    type: number
                  description:
                    description: A brief description of the bill.
                    type: string
                  categoryId:
                    description: The category to which the bill belongs.
                    type: string
                  status:
                    description: The status of the bill.
                    type: string
                  paymentMethod:
                    description: The method of payment for the bill.
                    type: string
                  shared:
                    description: Indicates whether the bill is shared.
                    type: boolean
                type: string
          description: Successful operation.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid search query. The provided search query is invalid
            or malformed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized. The user is not authenticated.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden. The user does not have permission to access this
            resource.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal server error. An unexpected error occurred on the
            server.
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service unavailable. The server is currently unable to handle
            the request due to temporary overload or maintenance.
      summary: Export bill list
      tags:
      - Export
      x-accepts:
      - application/json
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - text/csv
components:
  parameters:
    billId:
      description: The ID of the bill.
      explode: false
      in: path
      name: billId
      required: true
      schema:
        example: 123e4567-e89b-12d3-a456-426614174000
        format: uuid
        type: string
      style: simple
  schemas:
    Bill:
      example:
        billId: 123e4567-e89b-12d3-a456-426614174000
        userId: 123e4567-e89b-12d3-a456-426614174000
        quantity: 1.5
        description: Compra semanal
        categoryId: 123e4567-e89b-12d3-a456-426614174000
        status: PENDIENTE
        paymentMethod: EFECTIVO
        shared: false
        creationDate: 2026-10-24T00:00:00Z
        modificationDate: 2026-10-24T00:00:00Z
        deleteDate: 2000-01-23T04:56:07.000+00:00
        partaker:
          key:
            userId: 123e4567-e89b-12d3-a456-426614174000
            quantity: 0.75
        isActive: true
      properties:
        billId:
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        userId:
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        quantity:
          example: 1.5
          format: double
          type: number
        description:
          example: Compra semanal
          type: string
        categoryId:
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        status:
          allOf:
          - $ref: "#/components/schemas/StatusBill"
          example: PENDIENTE
        paymentMethod:
          allOf:
          - $ref: "#/components/schemas/paymentMethod"
          example: EFECTIVO
        shared:
          example: false
          type: boolean
        creationDate:
          example: 2026-10-24T00:00:00Z
          format: date-time
          type: string
        modificationDate:
          example: 2026-10-24T00:00:00Z
          format: date-time
          type: string
        deleteDate:
          format: date-time
          nullable: true
          type: string
          example: null
        partaker:
          additionalProperties:
            $ref: "#/components/schemas/Bill_partaker_value"
          type: object
        isActive:
          example: true
          type: boolean
      required:
      - billId
      - categoryId
      - description
      - isActive
      - paymentMethod
      - quantity
      - shared
      - status
      - userId
      type: object
    BillRequest:
      example:
        userId: 123e4567-e89b-12d3-a456-426614174000
        quantity: 1.5
        description: Compra semanal
        categoryId: 123e4567-e89b-12d3-a456-426614174000
        paymentMethod: EFECTIVO
      properties:
        userId:
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        quantity:
          example: 1.5
          format: double
          minimum: 0.01
          type: number
        description:
          example: Compra semanal
          type: string
        categoryId:
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        paymentMethod:
          allOf:
          - $ref: "#/components/schemas/paymentMethod"
          example: EFECTIVO
      required:
      - categoryId
      - description
      - paymentMethod
      - quantity
      - userId
      type: object
    StatusBill:
      enum:
      - PENDIENTE
      - PAGADO
      - CANCELADO
      - RECLAMADO
      - DEVUELTO
      example: PENDIENTE
      type: string
    paymentMethod:
      enum:
      - EFECTIVO
      - TARJETA
      - BIZUM
      - TRANSFERENCIA
      - OTRO
      example: EFECTIVO
      type: string
    ChangeStatusRequest:
      example:
        status: PAGADO
      properties:
        status:
          allOf:
          - $ref: "#/components/schemas/StatusBill"
          example: PAGADO
      required:
      - status
      type: object
    ShareBillRequest:
      description: Request payload for sharing a bill with other users. The communication
        will include the userId and the quantity each partaker is responsible for
        paying.
      example:
        partaker:
        - email: example@example.com
          quantity: 0.75
      properties:
        partaker:
          $ref: "#/components/schemas/ShareBillRequest_partaker"
      required:
      - partaker
      type: object
    PartakerBudget:
      example:
        userId: 123e4567-e89b-12d3-a456-426614174000
        quantity: 0.75
      properties:
        userId:
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        quantity:
          example: 0.75
          format: double
          type: number
      type: object
    Budget:
      example:
        budget: 1000.0
        wasted: 500.0
        availableBudget: 500.0
      properties:
        budget:
          example: 1000.0
          format: double
          type: number
        wasted:
          example: 500.0
          format: double
          type: number
        availableBudget:
          example: 500.0
          format: double
          type: number
      type: object
    Error:
      example:
        code: 400
        message: Invalid request parameters.
      properties:
        code:
          example: 400
          format: int32
          type: integer
        message:
          example: Invalid request parameters.
          type: string
      type: object
    Bill_partaker_value:
      example:
        userId: 123e4567-e89b-12d3-a456-426614174000
        quantity: 0.75
      properties:
        userId:
          example: 123e4567-e89b-12d3-a456-426614174000
          format: uuid
          type: string
        quantity:
          example: 0.75
          format: double
          type: number
      type: object
    ShareBillRequest_partaker:
      properties:
        email:
          example: example@example.com
          format: email
          type: string
        quantity:
          example: 0.75
          format: double
          type: number
      type: object

