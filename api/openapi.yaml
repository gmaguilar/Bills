  /bill/{billId}/partaker:
    get:
      description: "Retrieve the list of users who are partaker of a specific bill,\
        \ along with the quantitys they are responsible for. The billId is provided\
        \ in the path parameter. The response will include the details of each partaker,\
        \ including their user ID and the quantity they are responsible for contributing\
        \ to the bill. The user must be authenticated to access this endpoint, and\
        \ the provided bearer token must be valid. If the token is missing or invalid,\
        \ a 401 Unauthorized error will be returned. The billId provided in the path\
        \ must correspond to an existing bill in the system. If the billId is invalid\
        \ or does not exist, a 404 Not Found error will be returned. The billId provided\
        \ in the path must be for the authenticated user. If the billId belongs to\
        \ a different user, a 403 Forbidden error will be returned. The response will\
        \ be in JSON format, and the partaker details will be structured according\
        \ to the PartakerBudget schema defined in the components section of the API\
        \ documentation. The user can use this endpoint to view the list of partaker\
        \ for a specific bill, including their contributions, and to verify that the\
        \ bill has been shared correctly with the intended users."
      operationId: getpartaker
      parameters:
      - description: The ID of the bill.
        explode: false
        in: path
        name: billId
        required: true
        schema:
          example: 123e4567-e89b-12d3-a456-426614174000
